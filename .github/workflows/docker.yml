name: Build Cosmoseed Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: cosmoseed-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  version:
    name: Select image tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      build_version: ${{ steps.extract.outputs.build_version }}
      stable: ${{ steps.extract.outputs.stable }}
    steps:
      - name: Select tags from the ref
        id: extract
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "build_version=edge" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version=${BASH_REMATCH[1]}${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "build_version=v${BASH_REMATCH[1]}${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            if [[ -z "${BASH_REMATCH[2]}" ]]; then
              echo "stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "unsupported image ref: $GITHUB_REF" >&2
            exit 1
          fi
  build:
    name: Build and Push Cosmoseed Images
    needs:
      - version
    strategy:
      fail-fast: true
      matrix:
        build:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.build.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR container register
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Go Cache for Docker Build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            go-build
            go-pkg-mod
          key: ${{ runner.os }}-${{ runner.arch }}-cosmoseed-docker-${{ hashFiles('go.sum') }}

      - name: Inject cache
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "go-build": "/root/.cache/go-build",
              "go-pkg-mod": "/go/pkg/mod"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          platforms: ${{ matrix.build.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.version.outputs.build_version }}
            COMMIT=${{ github.sha }}

      - name: Export immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Hand off digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digests-${{ matrix.build.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create Multi-arch Cosmoseed Image
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Clear digest handoff directory
        run: |
          rm -rf -- digests
          mkdir -p digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve build digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list and push
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          digest_files=(digests/*)
          if [[ ${#digest_files[@]} -ne 2 ]]; then
            echo "expected exactly two architecture digests" >&2
            exit 1
          fi
          tags=(--tag "${IMAGE}:${VERSION}")
          images=()
          for file in "${digest_files[@]}"; do
            images+=("${IMAGE}@sha256:${file##*/}")
          done
          docker buildx imagetools create \
            "${tags[@]}" \
            "${images[@]}"

  latest:
    name: Promote newest stable image to latest
    needs:
      - version
      - merge
    if: needs.version.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cosmoseed-stable-latest
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote only the newest stable tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [[ "v${VERSION}" != "$newest" ]]; then
            echo "Skipping latest: $newest is newer than v${VERSION}"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}"
