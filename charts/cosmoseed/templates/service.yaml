apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmoseed.fullname" . }}
  labels: {{- include "cosmoseed.serviceLabels" (dict "root" . "role" "client") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "cosmoseed.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmoseed.fullname" . }}-metrics
  labels: {{- include "cosmoseed.serviceLabels" (dict "root" . "role" "metrics") | nindent 4 }}
  {{- with .Values.metricsService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector: {{- include "cosmoseed.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmoseed.fullname" . }}-headless
  labels: {{- include "cosmoseed.serviceLabels" (dict "root" . "role" "headless") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "cosmoseed.selectorLabels" . | nindent 4 }}
  ports:
    - name: p2p
      port: {{ .Values.ports.p2p }}
      targetPort: p2p
{{- range $ordinal := until (int .Values.replicaCount) }}
{{- if $.Values.config.externalAddresses }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmoseed.fullname" $ }}-{{ $ordinal }}-p2p
  labels: {{- include "cosmoseed.serviceLabels" (dict "root" $ "role" "p2p") | nindent 4 }}
  {{- with $.Values.p2pService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.p2pService.type }}
  selector:
    statefulset.kubernetes.io/pod-name: {{ include "cosmoseed.fullname" $ }}-{{ $ordinal }}
  ports:
    - name: p2p
      port: {{ $.Values.ports.p2p }}
      targetPort: p2p
{{- end }}
{{- end }}
